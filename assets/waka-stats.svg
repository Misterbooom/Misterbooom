  <text x="338" y="140" text-anchor="end" class="mono muted" font-size="12">19 hrs 39 mins</text>
  <text x="392" y="140" text-anchor="end" class="mono label" font-size="12">70.9%</text>
  <rect x="28" y="146" width="364" height="2" rx="1" class="track" />
