<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Development Stats">
  <style>
    :root {
      --bg: #0d1117;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --track: #21262d;
      --accent: #58a6ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --border: #d0d7de;
        --text: #1f2328;
        --muted: #656d76;
        --track: #eaeef2;
        --accent: #0969da;
      }
    }
    text {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }
    .card { fill: var(--bg); stroke: var(--border); }
    .divider { stroke: var(--border); stroke-width: 1; }
    .label { fill: var(--text); }
    .muted { fill: var(--muted); }
    .track { fill: var(--track); }
    .accent { fill: var(--accent); }
    .kpi-title { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
    .kpi-value { fill: var(--text); font-size: 20px; font-weight: 600; }
  </style>

  <rect x="0.5" y="0.5" width="799" height="279" rx="10" class="card" />

  <text x="28" y="38" class="kpi-title">TOTAL CODED</text>
  <text x="28" y="64" class="kpi-value">211 hrs 19 mins</text>

  <text x="300" y="38" class="kpi-title">COMMITS (7D / 1Y)</text>
  <text x="300" y="64" class="kpi-value mono">7 / 76</text>

  <text x="560" y="38" class="kpi-title">PRIMARY IDE</text>
  <text x="560" y="64" class="kpi-value">Rider</text>

  <line x1="28" y1="88" x2="772" y2="88" class="divider" />
  <line x1="420" y1="106" x2="420" y2="254" class="divider" />

  <text x="28" y="114" class="kpi-title">PROJECTS (7D)</text>
  <text x="28" y="140" class="label" font-size="13">BifyLang</text>
  <text x="338" y="140" text-anchor="end" class="mono muted" font-size="12">16 hrs 58 mins</text>
  <text x="392" y="140" text-anchor="end" class="mono label" font-size="12">83.4%</text>
  <rect x="28" y="146" width="364" height="2" rx="1" class="track" />
  <rect x="28" y="146" width="303.5" height="2" rx="1" class="accent" />
  <text x="28" y="166" class="label" font-size="13">GlassIslandsLinux</text>
  <text x="338" y="166" text-anchor="end" class="mono muted" font-size="12">3 hrs 20 mins</text>
  <text x="392" y="166" text-anchor="end" class="mono label" font-size="12">16.4%</text>
  <rect x="28" y="172" width="364" height="2" rx="1" class="track" />
  <rect x="28" y="172" width="59.6" height="2" rx="1" class="accent" />
  <text x="28" y="192" class="label" font-size="13">Round-Display</text>
  <text x="338" y="192" text-anchor="end" class="mono muted" font-size="12">2 mins</text>
  <text x="392" y="192" text-anchor="end" class="mono label" font-size="12">0.2%</text>
  <rect x="28" y="198" width="364" height="2" rx="1" class="track" />
  <rect x="28" y="198" width="2.0" height="2" rx="1" class="accent" />

  <text x="448" y="114" class="kpi-title">EDITORS (7D)</text>
  <text x="448" y="140" class="label" font-size="13">Rider</text>
  <text x="718" y="140" text-anchor="end" class="mono muted" font-size="12">20 hrs 3 mins</text>
  <text x="772" y="140" text-anchor="end" class="mono label" font-size="12">98.5%</text>
  <rect x="448" y="146" width="324" height="2" rx="1" class="track" />
  <rect x="448" y="146" width="319.2" height="2" rx="1" class="accent" />
  <text x="448" y="166" class="label" font-size="13">Antigravity</text>
  <text x="718" y="166" text-anchor="end" class="mono muted" font-size="12">13 mins</text>
  <text x="772" y="166" text-anchor="end" class="mono label" font-size="12">1.1%</text>
  <rect x="448" y="172" width="324" height="2" rx="1" class="track" />
  <rect x="448" y="172" width="3.6" height="2" rx="1" class="accent" />
  <text x="448" y="192" class="label" font-size="13">WebStorm</text>
  <text x="718" y="192" text-anchor="end" class="mono muted" font-size="12">4 mins</text>
  <text x="772" y="192" text-anchor="end" class="mono label" font-size="12">0.4%</text>
  <rect x="448" y="198" width="324" height="2" rx="1" class="track" />
  <rect x="448" y="198" width="2.0" height="2" rx="1" class="accent" />
</svg>
